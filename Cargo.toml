[workspace]
resolver = "2"
members = [
    "crates/topaz-proto",
    "crates/topaz-core",
    "crates/topaz-net",
    "crates/topaz-fabric",
    "crates/topaz-vpn",
    "crates/topaz-coord",
    "crates/topaz-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde", "pkcs8"] }
chacha20poly1305 = "0.10"
data-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
spake2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
futures = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async"] }
base64 = "0.22"
socket2 = "0.6"
if-addrs = "0.13"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.29"
tokio-tungstenite = "0.26"
yamux = "0.13"
zeroize = "1"
